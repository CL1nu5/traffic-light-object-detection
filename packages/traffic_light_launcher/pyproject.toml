[project]
name = "traffic-light-launcher"
version = "0.1.0"
description = "Stable launcher for the local traffic-light workflow"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
traffic-light = "traffic_light_launcher:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
