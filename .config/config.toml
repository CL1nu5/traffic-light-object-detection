[paths]
raw_data = "data/raw/lisa"
processed_data = "data/processed/lisa_yolo_tiled_3class"
output = "out"

[dataset]
kaggle_handle = "mbornoe/lisa-traffic-light-dataset"
annotation_kind = "BOX"
train_ratio = 0.70
validation_ratio = 0.15
test_ratio = 0.15
split_seed = 42
split_attempts = 5000
materialization = "hardlink" # Falls back to copying when links are unavailable.
overwrite = true

[tiling]
size = 640
overlap_ratio = 0.20
min_box_area_ratio = 0.50
max_empty_to_positive_ratio = 0.25
jpeg_quality = 95
inference_batch = 1 # YOLO26l is large; keep sliced inference within 8 GB VRAM.
perform_standard_prediction = true
postprocess_type = "GREEDYNMM"
postprocess_match_metric = "IOU"
postprocess_match_threshold = 0.50

[training]
model = "yolo26l.pt"
image_size = 640
epochs = 20
batch = -1 # Auto-fit a batch targeting about 60% VRAM on the RTX 3060 Ti.
optimizer = "AdamW" # Stable on the Windows CUDA/PyTorch setup used by this project.
lr0 = 0.0002 # Conservative for a large pretrained model and a small physical batch.
lrf = 0.10
momentum = 0.90 # AdamW beta1.
weight_decay = 0.0005
warmup_epochs = 1.0
warmup_bias_lr = 0.0 # Avoid the default 0.1 bias warmup, which destabilizes AdamW.
cos_lr = true
box = 9.83 # YOLO26 L-size fine-tuning loss balance.
cls = 0.65
dfl = 0.96 # YOLO26 uses this gain for its DFL-free distance regression term.
cls_pw = 0.25 # Mild inverse-frequency weighting for the rare warning class.
mosaic = 0.0 # Train on the same standalone tiles seen during validation.
close_mosaic = 0
hsv_h = 0.0 # State labels depend directly on light color.
hsv_s = 0.20
hsv_v = 0.20
translate = 0.05
scale = 0.15
fliplr = 0.50
amp = true
device = 0 # Require the RTX 3060 Ti; fail fast if the CUDA PyTorch build is missing.
workers = 4
seed = 42
deterministic = false
patience = 5
cache = false
run_name = "lisa_yolo26l_tiled_640_3class"

[evaluation]
weights = "" # Empty uses the best checkpoint from the configured training run.
confidence = 0.001 # Keep low-confidence detections for the COCO precision/recall curve.
confusion_confidence = 0.25
confusion_iou = 0.45
device = 0
batch = 1 # Memory-safe validation for YOLO26l on an 8 GB GPU.
workers = 4
run_name = "lisa_tiled_test"

[inference]
source = "" # Image, directory, or video. Empty uses sample test images.
sample_count = 12
confidence = 0.25
device = 0
run_name = "lisa_tiled_predictions"
