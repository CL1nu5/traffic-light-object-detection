[project]
name = "traffic-light-prediction"
version = "0.1.0"
description = "Train and evaluate Ultralytics YOLO traffic-light detection on the LISA dataset"
readme = "README.md"
authors = [
    { name = "Linus Pummer", email = "linus.pummer@web.de" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "kagglehub>=1.0.2",
    "opencv-python>=5.0.0.93",
    "pillow>=11.0",
    "pycocotools>=2.0.11",
    "python-dotenv>=1.1",
    "sahi>=0.12.6",
    "traffic-light-launcher",
    "ultralytics>=8.3.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.4",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.uv.sources]
traffic-light-launcher = { path = "packages/traffic_light_launcher", editable = false }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
